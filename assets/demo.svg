<text class="t" x="430.0" y="22" fill="#a1a1aa" text-anchor="middle">claude — /checklist</text>
<text class="t l l0" x="24.0" y="72"><tspan fill="#7cc4fa" class="b">&gt; </tspan><tspan fill="#ffffff">I want a small CLI tool that renames my photo files by date.</tspan></text>
<rect class="cov" x="40.3" y="56" width="524" height="22" fill="#18181b"/>
<text class="t l l1" x="24.0" y="102"><tspan fill="#f0a35e">● </tspan><tspan fill="#d4d4d8">Treating this as new work — questions first. </tspan><tspan fill="#f0a35e">Size: large (new tool) → 3 rounds</tspan></text>
<text class="t l l2" x="40.3" y="124"><tspan fill="#8b8b94">Looked around: ./photos-tool is empty · Python 3.12 · no exiftool</tspan></text>
<text class="t l l3" x="40.3" y="146"><tspan fill="#ffffff" class="b">Round 1 — goal and output</tspan></text>
<text class="t l l4" x="40.3" y="168"><tspan fill="#d4d4d8">Where does the date come from?</tspan></text>
<text class="t l l5" x="40.3" y="190"><tspan fill="#7cc4fa">❯ EXIF date taken, fallback to modified time </tspan><tspan fill="#f0a35e">(Recommended)</tspan></text>
<text class="t l l6" x="56.5" y="212"><tspan fill="#8b8b94">EXIF only  ·  modified time only</tspan></text>
<text class="t l l7" x="56.5" y="234"><tspan fill="#8b8b94">Take the recommendations for everything else</tspan></text>
<text class="t l l8" x="40.3" y="256"><tspan fill="#8b8b94">Rounds 2–3: dry-run by default, never overwrite, Pillow only … </tspan></text>
<text class="t l l9" x="40.3" y="278"><tspan fill="#ffffff" class="b">Summary  </tspan><tspan fill="#d4d4d8">You said: </tspan><tspan fill="#6cc58a">11 decisions</tspan><tspan fill="#d4d4d8">   My assumption: </tspan><tspan fill="#e5c07b">pillow-heif — confirm?</tspan></text>
<text class="t l l10" x="40.3" y="300"><tspan fill="#6cc58a" class="b">✓ </tspan><tspan fill="#d4d4d8">BRIEF saved → ~/.claude/checklist/briefs/2026-10-01_photos-tool.md</tspan></text>
<text class="t l l11" x="40.3" y="322"><tspan fill="#8b8b94">… work …</tspan></text>
<text class="t l l12" x="40.3" y="344"><tspan fill="#ffffff" class="b">Done check</tspan></text>
<text class="t l l13" x="56.5" y="366"><tspan fill="#6cc58a" class="b">✓ </tspan><tspan fill="#d4d4d8">dry-run changes nothing   </tspan><tspan fill="#6cc58a" class="b">✓ </tspan><tspan fill="#d4d4d8">clashes get _2   </tspan><tspan fill="#e5c07b" class="b">! </tspan><tspan fill="#e5c07b">2,000-photo timing not verified</tspan></text>
<text class="t l l14" x="40.3" y="388"><tspan fill="#f0a35e">Lesson → </tspan><tspan fill="#d4d4d8">Next time, ask: &quot;Is there a real-size sample to test on?&quot;</tspan></text>
<text class="t l l15" x="56.5" y="410"><tspan fill="#8b8b94">Add it to fields/coding.md?  </tspan><tspan fill="#7cc4fa" class="b">Yes</tspan></text>
